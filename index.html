<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Sharanjeet Kaur – Full-Stack Developer | Gen-AI Developer</title>

  <meta
    name="description"
    content="Portfolio of Sharanjeet Kaur, a full-stack and Gen-AI developer building web apps with React, Node.js, Express, MongoDB and the Google Gemini API."
  >

  <meta name="theme-color" content="#f7f6f3">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="top" id="header">
    <div class="wrap">

      <a class="logo" href="#top" id="logo"></a>

      <nav aria-label="Sections">
        <a class="l" href="#work">Projects</a>
        <a class="l" href="#skills">Skills</a>
        <a class="l" id="navEdu" href="#education">Education</a>
        <a class="l" href="#contact">Contact</a>

        <button
          class="tbtn"
          id="theme"
          type="button"
          aria-label="Switch to dark theme"
        >
          <svg
            class="mn"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>

          <svg
            class="sun"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
      </nav>

    </div>
  </header>

  <main id="top">
    <div class="wrap">

      <div class="hero">
        <div>

          <div class="status rv" id="statusWrap" style="--i:0">
            <i></i>
            <span id="status"></span>
          </div>

          <h1 class="rv" id="name" style="--i:1"></h1>

          <p class="role rv" id="role" style="--i:2"></p>

          <p class="intro rv" id="intro" style="--i:3"></p>

          <div class="cta rv" style="--i:4">
            <a class="btn primary" href="#work">View projects</a>

            <a class="btn" id="resumeHero" href="#" download>
              Download resume
            </a>

            <a class="btn" href="#contact">Contact me</a>
          </div>

        </div>

        <dl class="facts rv" id="facts" style="--i:5"></dl>
      </div>

      <section id="work">
        <h2>Projects</h2>
        <p class="lead" id="workLead"></p>
        <div class="projects" id="projects"></div>
      </section>

      <section id="skills">
        <div class="two">

          <div id="aboutCol">
            <h2>About</h2>
            <p class="about-text" id="bio"></p>
          </div>

          <div>
            <h2>Skills</h2>
            <div id="skillGroups"></div>
          </div>

        </div>
      </section>

      <section id="education">
        <h2>Education</h2>
        <ul class="edu" id="edu"></ul>
      </section>

      <section class="contact" id="contact">
        <div class="cbox">

          <h2>Let's work together</h2>

          <p class="lead" id="contactLead"></p>

          <a class="mail" id="mail"></a>

          <div class="email-action">
            <a
              class="btn primary"
              id="emailButton"
              href="#"
              target="_blank"
              rel="noopener"
            >
              Email me ↗
            </a>

          </div>

          <div class="clinks" id="clinks"></div>

        </div>
      </section>

    </div>
  </main>

  <footer>
    <div class="wrap">
      <span id="foot"></span>
      <span>Built with HTML, CSS and JavaScript</span>
    </div>
  </footer>

  <script src="script.js" defer></script>

</body>
</html>
